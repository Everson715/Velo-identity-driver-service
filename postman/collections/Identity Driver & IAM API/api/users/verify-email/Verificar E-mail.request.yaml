$kind: http-request
description: Validação de conta via token/código enviado por e-mail.
url: "{{baseUrl}}/api/users/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "123456"
    }
examples: ./.resources/Verificar E-mail.resources/examples
order: 1000
