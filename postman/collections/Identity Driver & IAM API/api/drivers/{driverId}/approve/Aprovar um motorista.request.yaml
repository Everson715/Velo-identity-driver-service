$kind: http-request
description: Aprova o cadastro de um motorista. Protegido contra Race Conditions via Lock Otimista.
url: "{{baseUrl}}/api/drivers/:driverId/approve"
method: POST
headers:
  Accept: application/json
pathVariables:
  - key: driverId
    value: string
    description: ID do motorista (UUID)
examples: ./.resources/Aprovar um motorista.resources/examples
order: 1000
