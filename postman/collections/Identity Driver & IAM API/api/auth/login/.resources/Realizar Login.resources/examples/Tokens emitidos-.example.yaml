$kind: http-example
name: Tokens emitidos.
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "jose@upe.br",
        "password": "secret123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "refresh_token": "string",
        "expires_in": 3600
      }
order: 1000
